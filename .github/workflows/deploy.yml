name: Deploy Backend to Hostinger VPS

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          command_timeout: 15m
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin
            [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh" 2>/dev/null || true
            sudo systemctl stop pm2-root 2>/dev/null || true
            sudo systemctl stop pm2-ubuntu 2>/dev/null || true
            sudo systemctl stop pm2 2>/dev/null || true
            pm2 kill 2>/dev/null || npx pm2 kill 2>/dev/null || true

            if [ -d "/root/AOTMS_LMS" ]; then
              cd /root/AOTMS_LMS
            elif [ -d "$HOME/AOTMS_LMS" ]; then
              cd "$HOME/AOTMS_LMS"
            elif [ -d "/root/AOTMS_LMS-1" ]; then
              cd /root/AOTMS_LMS-1
            fi

            git reset --hard HEAD
            git pull origin main

            docker compose down --remove-orphans --volumes 2>/dev/null || true
            docker rm -f aotms_lms-backend-1 aotms_lms-backend-2 aotms_lms-backend-3 aotms_lms-backend-4 aotms_lms-nginx-1 2>/dev/null || true
            for c in $(docker ps -a -q --filter "name=aotms_lms"); do docker rm -f "$c" 2>/dev/null || true; done

            docker stop $(docker ps -q --filter "publish=5000") 2>/dev/null || true
            fuser -k -9 5000/tcp 2>/dev/null || true

            docker compose up --build -d --remove-orphans --force-recreate
