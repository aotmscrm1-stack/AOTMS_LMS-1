name: Deploy Backend to Hostinger VPS

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          command_timeout: 15m
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin
            [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh" 2>/dev/null || true
            sudo systemctl stop pm2-root 2>/dev/null || true
            sudo systemctl stop pm2-ubuntu 2>/dev/null || true
            sudo systemctl stop pm2 2>/dev/null || true
            pm2 kill 2>/dev/null || npx pm2 kill 2>/dev/null || true
            docker stop $(docker ps -q --filter "publish=5000") 2>/dev/null || true
            fuser -k -9 5000/tcp 2>/dev/null || true
            cd /root/AOTMS_LMS || cd ~/AOTMS_LMS || cd /root/AOTMS_LMS-1 || true
            git reset --hard HEAD
            git pull origin main
            docker compose down || true
            docker compose up --build -d
