services:
  # Backend Node.js service (Scalable)
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    expose:
      - "5000"
    deploy:
      replicas: 4
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 128M
    env_file:
      - ./Backend/.env
    restart: always

  # NGINX Load Balancer (Routes traffic across scaled backend replicas)
  nginx:
    image: nginx:alpine
    ports:
      - "5000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: always
